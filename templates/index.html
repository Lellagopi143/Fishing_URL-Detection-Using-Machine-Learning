<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Phishing URL Detection</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <div class="container">
        <h1>Phishing URL Detection</h1>
        <form method="POST">
            <input type="text" name="url" placeholder="Enter URL here" value="{{ url }}" required>
            <button type="submit">Check URL</button>
        </form>

        {% if result %}
        <div class="result">
            <h2>Result: {{ result.prediction }}</h2>
            <p>Phishing Probability: {{ result.probability }}</p>
        </div>
        {% endif %}
    </div>
</body>
</html>
